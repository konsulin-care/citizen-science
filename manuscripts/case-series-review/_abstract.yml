abstract: |
  **Background:** Stress, depression, anxiety and burnout are common, but most people who experience them never reach services, so their experience rarely becomes data. Citizen science, in which members of the public take part in research as partners rather than only as subjects, has been proposed as a way to close this gap.

  **Aim:** To describe how citizens took part across the stages of research in a set of successful and failed cases and what these cases teach for building citizen-centred mental health research in Indonesia.

  **Methods:** A narrative review of eight purposively selected cases comprises four mental-health citizen science projects, two Indonesian citizen health-data initiatives, and two failures involving mental-health data. Each case was scored on an 18-item framework covering what changed (three items), where citizens took part (6), how the project was run (7), and durability and harm (2).

  **Results:** [Pending second coder.] Citizens led every stage of research in only two cases, both founded by citizens. Returning results to participants (one of eight cases), project evaluation (one of eight) and recognising contributors in a form they chose (none of eight) were consistently lacking, mostly because sources did not report them. Uptake by decision-makers was documented in one case. Both failures broke down at consent, where data from people in distress were used for a purpose they had not agreed to.

  **Conclusion:** Citizen involvement can surface new questions and produce evidence faster than conventional routes, but the practices that build trust are rarely documented.
