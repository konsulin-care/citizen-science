abstract: >
  **Background.** Stress, depression, anxiety and burnout are common,
  but most people who experience them never reach services, so their experience
  rarely becomes data. Citizen science, in which members of the public take part
  in research as partners rather than only as subjects, has been proposed as a
  way to close this gap. Evidence on how it works in mental health comes almost
  entirely from high-income countries and rarely includes projects that failed.

  **Aim.** To describe how citizens took part across the stages of research in a
  set of successful and failed cases, what changed because they took part, and
  what these cases teach for building citizen-centred mental health research in
  Indonesia.

  **Methods.** A narrative review of eight purposively selected cases: four
  mental-health citizen science projects, two Indonesian citizen health-data
  initiatives, and two failures involving mental-health data. Each case was
  scored on an 18-item framework covering what changed (three items), where
  citizens took part (six items), how the project was run (seven items), and
  durability and harm (two items), using a four-level scale (met, partly met,
  not met, not reported). Sources were peer-reviewed articles, preprints and
  organisational reports, with news used only where nothing else existed.

