name: CI
on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run lint:md

  changes:
    runs-on: ubuntu-latest
    outputs:
      manuscripts: ${{ steps.detect.outputs.manuscripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          ids=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD | sh src/shell/affected-manuscripts.sh)
          echo "manuscripts=$ids" >> "$GITHUB_OUTPUT"

  render:
    needs: changes
    if: needs.changes.outputs.manuscripts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manuscript: ${{ fromJson(needs.changes.outputs.manuscripts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('mise.toml') }}
      - run: mise run render "manuscripts/${{ matrix.manuscript }}/article.qmd"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.manuscript }}-pdf
          path: manuscripts/${{ matrix.manuscript }}/article.pdf
          retention-days: 7
          if-no-files-found: error
